name: NHL API and ingestion canary

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nhl-api-ingestion-canary
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pucksdata_canary_test

jobs:
  canary:
    name: Live API to PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pucksdata_canary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pucksdata_canary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install migration runner
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres

      - name: Apply database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: ./scripts/run-migrations.sh

      - name: Exercise live API-to-database path
        run: |
          for attempt in 1 2 3; do
            if cargo test --test test_canary -- --ignored --nocapture \
              && cargo test --test test_official_games -- --ignored --nocapture; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Canary attempt $attempt failed; retrying..."
              sleep $((attempt * 15))
            fi
          done
          exit 1
