name: CI

on:
  push:
    branches: [prime]
  pull_request:
    branches: [prime]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pucksdata_test

jobs:
  quality:
    name: Rust quality gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pucksdata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pucksdata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install migration runner
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres

      - name: Apply database migrations
        env:
          MIGRATION_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: ./scripts/run-migrations.sh

      - name: Verify baseline parity and migration safety
        run: |
          python3 scripts/check_schema_baseline.py
          python3 scripts/check_migration_runner.py

      - name: Verify populated schema upgrade and Consumer contracts
        run: python3 scripts/check_schema_upgrade.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Run unit and integration tests
        run: cargo test --all-targets


      - name: Test independent HTML audit helper
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
