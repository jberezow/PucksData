name: Scheduled database sync

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-sync
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  sync:
    name: Sync and assess database
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build engine
        id: build
        run: cargo build --release --bin pucksdata

      - name: Synchronize database
        run: target/release/pucksdata sync

      - name: Collect database health
        id: health
        if: always() && steps.build.outcome == 'success'
        run: |
          target/release/pucksdata status --json --no-fail > pucksdata-health.json
          jq empty pucksdata-health.json
          echo "report=true" >> "$GITHUB_OUTPUT"

      - name: Add health summary
        if: always() && steps.health.outputs.report == 'true'
        run: |
          status=$(jq -r '
            if .summary.healthy then "healthy"
            elif .summary.actionable_gap_games == 0
              and .summary.goals_missing_shots == 0
              and .summary.backfill_failed == 0
            then "healthy with known gaps"
            else "attention required"
            end
          ' pucksdata-health.json)
          {
            echo "## PucksData health"
            echo "- Status: **${status}**"
            jq -r '"- Last sync: " + (.summary.last_sync_at // "not recorded")' pucksdata-health.json
            jq -r '"- Latest completed game: " + (.summary.latest_completed_game_date // "not recorded")' pucksdata-health.json
            jq -r '"- Event coverage: " + ((.summary.games_with_events / (if .summary.completed_games == 0 then 1 else .summary.completed_games end) * 10000 | round) / 100 | tostring) + "%"' pucksdata-health.json
            jq -r '"- Missing games: " + (.summary.missing_event_games | tostring) + " (" + (.summary.acknowledged_gap_games | tostring) + " known, " + (.summary.actionable_gap_games | tostring) + " actionable)"' pucksdata-health.json
            jq -r '"- Failed backfills: " + (.summary.backfill_failed | tostring)' pucksdata-health.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == "attention required" ]]; then
            echo "::warning::Database health requires attention; review the job summary and artifact."
          fi

      - name: Upload health report
        if: always() && steps.health.outputs.report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pucksdata-health-${{ github.run_id }}
          path: pucksdata-health.json
          retention-days: 14
