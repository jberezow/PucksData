[package]
name = "pucksdata"
version = "1.8.0"
edition = "2021"
authors = ["Jon Berezowski"]
description = "A production-oriented NHL play-by-play ETL engine for PostgreSQL"
license = "MIT"
repository = "https://github.com/jberezow/pucksdata"
readme = "README.md"
keywords = ["nhl", "hockey", "etl", "postgresql", "analytics"]
categories = ["command-line-utilities", "database"]

[dependencies]
# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Date/time
time = { version = "0.3", features = ["serde-human-readable", "macros", "parsing"] }

# Progress bars
indicatif = "0.18"

# Environment
dotenvy = "0.15"
scraper = "0.27.0"

# Diagnostics
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
