[package]
name = "pucksdata"
version = "1.5.0"
edition = "2021"
authors = ["Jon Berezowski"]
description = "A production-oriented NHL play-by-play ETL engine for PostgreSQL"
license = "MIT"
repository = "https://github.com/jberezow/pucksdata"
readme = "README.md"
keywords = ["nhl", "hockey", "etl", "postgresql", "analytics"]
categories = ["command-line-utilities", "database"]

[dependencies]
# HTTP
reqwest = { version = "0.12", features = ["json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "time", "chrono"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI (used in Phase 3)
clap = { version = "4.4", features = ["derive"] }

# Date/time
time = { version = "0.3", features = ["serde", "macros", "parsing"] }
chrono = { version = "0.4", features = ["serde"] }

# Progress bars
indicatif = "0.18"

# Environment
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
