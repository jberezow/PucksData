[package]
name = "pucksdata"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
clap = { version = "4.4", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19.0"  # For LazyLock in non-nightly Rust
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
time = { version = "0.3", features = ["serde", "macros", "parsing"] }
indicatif = "0.17"

[dev-dependencies]
# For future use with mocking HTTP requests
# mockito = "1.2"
# wiremock = "0.5"
tokio = { version = "1", features = ["full"] }
