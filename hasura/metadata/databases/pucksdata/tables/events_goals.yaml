table:
  name: goals
  schema: events
object_relationships:
  - name: game
    using:
      foreign_key_constraint_on: game_id
  - name: scorer
    using:
      foreign_key_constraint_on: scorer_id
  - name: primary_assist
    using:
      foreign_key_constraint_on: primary_assist_id
  - name: secondary_assist
    using:
      foreign_key_constraint_on: secondary_assist_id
  - name: goalie
    using:
      foreign_key_constraint_on: goalie_id
  - name: scoring_team
    using:
      foreign_key_constraint_on: scoring_team_id
  - name: defending_team
    using:
      foreign_key_constraint_on: defending_team_id 